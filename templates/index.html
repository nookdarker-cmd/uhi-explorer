      <li><b>ระดับ ${LEVEL_NAMES.join(' / ')}</b> แบ่งเพื่อให้เห็นภาพ (${cfg.lst_breaks.join(', ')} °C)</li>
      <li><b>ฤดู</b> ${seasons} (แบ่งตามกรมอุตุนิยมวิทยา) หน้าฝนมีเมฆมาก ข้อมูลอาจน้อย</li>
      <li><b>วันฟ้าโปร่ง</b> ใช้เฉพาะช่องที่มีวันฟ้าโปร่งอย่างน้อย ${cfg.n_min} วันในฤดูของปีนั้น ช่องที่น้อยกว่านี้ถือว่าไม่มีข้อมูล</li>
      <li><b>พื้นที่สีเขียว</b> ต้นไม้ หญ้า และพุ่มไม้ที่มีอยู่แล้ว</li>
      <li><b>พื้นที่ปลูกต้นไม้เพิ่มได้</b> หญ้า พุ่มไม้ และดินเปล่าในย่านที่มีคนอยู่ คือที่ที่ยังไม่มีต้นไม้ ไม่นับนา ไร่ และแหล่งน้ำ (หญ้าจึงเป็นทั้งพื้นที่สีเขียวและที่ที่ปลูกต้นไม้เพิ่มได้)</li>
      <li><b>สัดส่วนพื้นผิว</b> ดูว่าแต่ละจุด 10 ม. เป็นประเภทไหนบ่อยที่สุดตลอดปี (Dynamic World) แล้วนับเป็นสัดส่วนพื้นที่</li>
      <li><b>ช่วงความเชื่อมั่น 95%</b> ช่วงที่ค่าเฉลี่ยจริงน่าจะอยู่ ถ้าช่วงของสองกลุ่มไม่ซ้อนกัน ถือว่าต่างกันชัดเจน</li>
    </ul>

    <h3>ข้อควรรู้</h3>
    <ul>
      <li>ตัวเลขที่เทียบกันเป็น<b>ความสัมพันธ์</b> ไม่ได้พิสูจน์สาเหตุ เช่น ย่านที่สร้างอาคารเพิ่มมักสูญเสียต้นไม้ไปพร้อมกัน</li>
      <li>ข้อมูลอุณหภูมิละเอียดช่องละราว 1 กม. จึงเห็นภาพระดับย่าน ไม่ใช่รายบ้านหรือรายถนน</li>
      <li>“พื้นที่ปลูกต้นไม้เพิ่มได้” เป็นแค่<b>จุดที่น่าตรวจสอบ</b> ต้องดูเจ้าของที่ดินและแผนการใช้ที่ดินหรือผังเมืองก่อนเสนอ และใช้แผนที่ปี 2021 บางแห่งอาจถูกสร้างไปแล้ว</li>
      <li>ประชากรจาก GHSL เป็นการประมาณผู้อยู่อาศัยจริง (รวมผู้ไม่ได้ย้ายทะเบียนบ้าน) จึงมากกว่าตัวเลขทะเบียนราษฎร์ เช่น กรุงเทพฯ ราว 11 ล้านคน เทียบกับทะเบียนราว 5.5 ล้านคน และเป็นการสัมผัสความร้อน ไม่ใช่จำนวนผู้ป่วย</li>
      <li>ระดับผิวเย็นถึงผิวร้อนจัดเป็นระดับของอุณหภูมิพื้นผิว ไม่ใช่เกณฑ์อากาศร้อนของกรมอุตุนิยมวิทยา (ซึ่งใช้อุณหภูมิอากาศ)</li>
      <li>${CI_NOTE}</li>
    </ul>

    <h3>แหล่งข้อมูล</h3>
    <ul>
      <li>อุณหภูมิพื้นผิว: NASA MODIS Aqua (MYD11A1) ปี ${cfg.first_year}–${cfg.aqua_last_year} และ VIIRS (VNP21A1D) ปี ${cfg.aqua_last_year + 1} เป็นต้นไป ปรับค่า VIIRS ให้อยู่ระดับเดียวกับ Aqua ทีละช่อง จากผลต่างของสองดาวเทียมในวันเดียวกัน (ปี ${by[0]}–${by[1]}) แล้วตรวจสอบกับปี ${cy[0]}–${cy[1]} ซึ่งไม่ได้ใช้ตอนปรับเทียบ</li>
      <li>พื้นผิว: Dynamic World V1 ปี ${cfg.dw_first_year} เป็นต้นไป (This dataset is produced for the Dynamic World Project by Google in partnership with National Geographic Society and the World Resources Institute.)</li>
      <li>พื้นที่ปลูกต้นไม้เพิ่มได้: ESA WorldCover 2021 ละเอียด 10 ม.</li>
      <li>สิ่งปลูกสร้างย้อนหลัง ประชากร และระดับความเป็นเมือง: GHSL BUILT-S, POP และ SMOD (European Commission JRC)</li>
      <li>ความสูงภูมิประเทศ: SRTM (NASA)</li>
      <li>ขอบเขตจังหวัด: FAO GAUL 2015 (ใช้เพื่อการศึกษา ไม่ใช่เชิงพาณิชย์) ในชุดนี้บึงกาฬยังรวมอยู่กับหนองคาย</li>
    </ul>`;
}

// จำนวนชุดที่คำนวณล่วงหน้าเสร็จแล้ว: ถ้าเพิ่มขึ้นและชั้นที่เปิดอยู่ยังเป็นแบบช้า ให้ขอชั้นใหม่ (แบบเร็ว)
function setPrecompute(pre) {
  if (!pre || !isNum(pre.ready)) return;
  const changed = precomputeReady != null && pre.ready !== precomputeReady;
  precomputeReady = pre.ready;
  if (changed && booted && overlayInfo && overlayInfo.fast === false) loadOverlay();
}
let coverageTimer = null;
async function loadCoverage() {
  clearTimeout(coverageTimer);
  let more = true;
  try {
    const d = await api('/api/coverage');
    const parts = [];
    if (d.viirs_last) parts.push(`ข้อมูลอุณหภูมิ VIIRS ล่าสุดในระบบ: ${d.viirs_last}`);
    if (d.precompute && isNum(d.precompute.ready) && isNum(d.precompute.total)) {
      const { ready, total } = d.precompute;
      more = ready < total;
      parts.push(!more ? 'ข้อมูลทุกปีคำนวณล่วงหน้าไว้แล้ว (โหลดเร็ว)'
        : `กำลังคำนวณข้อมูลล่วงหน้า ${ready}/${total} ชุด ระหว่างนี้บางส่วนอาจโหลดช้า`);
      setPrecompute(d.precompute);
    }
    $('coverage').textContent = parts.join(' · ');
  } catch (err) { /* ไม่จำเป็นต้องแจ้ง */ }
  // ระหว่างที่ยังคำนวณล่วงหน้าไม่ครบ ตรวจซ้ำทุก 5 นาที (เฉพาะตอนเปิดหน้าอยู่)
  if (more) coverageTimer = setTimeout(() => { if (document.visibilityState === 'visible') loadCoverage(); else document.addEventListener('visibilitychange', loadCoverage, { once: true }); }, 5 * 60 * 1000);
}

// =============================================================== URL (ใช้ทำ QR code)
function writeHash() {
  if (!booted) return;
  const h = new URLSearchParams();
  h.set('y', state.year);
  h.set('s', state.season);
  h.set('l', state.layer);
  if (state.focus && state.focus.province) h.set('p', state.focus.province);
  h.set('t', state.tab);
  if (cmpOpen()) h.set('v', 'compare');
  const next = '#' + h.toString();
  if (location.hash !== next) history.replaceState(null, '', next);
}
// เปิดลิงก์ที่มีค่าที่เลือกต่างไปในแท็บเดิม (เช่น สแกน QR อีกอัน) - replaceState ข้างบนไม่ทำให้เกิด hashchange
// จึงโหลดหน้าใหม่ตามลิงก์ได้เลยโดยไม่ชนกับการเขียน hash ของแอปเอง
window.addEventListener('hashchange', () => { if (booted) location.reload(); });
function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const y = parseInt(h.get('y'), 10);
  if (y >= cfg.first_year && y <= cfg.last_year) state.year = y;
  const s = h.get('s');
  if (s && cfg.seasons && cfg.seasons[s]) state.season = s;
  const l = h.get('l');
  if (l && LAYERS[l]) state.layer = l;
  const t = h.get('t');
  if (TABS.includes(t)) state.tab = t;
  const p = h.get('p');
  return { year: state.year === y, province: p && (PROVINCE_TH[p] || provinces.some(x => x.en === p)) ? p : null, compare: h.get('v') === 'compare' };
}

// =============================================================== เริ่มต้น
function showStartup(mode, extra) {
  const box = $('startup');
  if (mode === 'hide') { box.hidden = true; return; }
  box.hidden = false;
  const T = {
    loading: ['กำลังเริ่มระบบ…', ''],
    waking: ['กำลังเริ่มระบบ…', 'เซิร์ฟเวอร์กำลังตื่น (ถ้าไม่มีคนใช้งานสักพักอาจใช้เวลาราว 1 นาที)'],
    retrying: ['กำลังเริ่มระบบ…', 'เซิร์ฟเวอร์กำลังตื่น (ถ้าไม่มีคนใช้งานสักพักอาจใช้เวลาราว 1 นาที)\nเชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กำลังลองใหม่…'],
    failed: ['เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'ตรวจการเชื่อมต่ออินเทอร์เน็ต แล้วลองใหม่อีกครั้ง'],
    version: ['หน้าเว็บกับเซิร์ฟเวอร์เป็นคนละรุ่น', 'กรุณารีเฟรชหน้า (กด Ctrl+F5)']
  }[mode];
  $('suTitle').textContent = T[0];
  $('suText').textContent = T[1] + (extra ? '\n' + extra : '');
  $('suSpin').hidden = mode === 'failed' || mode === 'version';
  const btn = $('suBtn');
  btn.hidden = !(mode === 'failed' || mode === 'version');
  btn.textContent = mode === 'version' ? 'รีเฟรชหน้า' : 'ลองใหม่อีกครั้ง';
  btn.onclick = mode === 'version' ? () => location.reload() : () => boot();
  if (!btn.hidden) btn.focus();
}

let booting = false;
const BOOT_BUDGET = 120000;
async function boot() {
  if (booting) return;
  booting = true;
  showStartup('loading');
  const t0 = Date.now();
  let failed = false;
  const wake = setTimeout(() => { if (!failed) showStartup('waking'); }, 3500);
  try {
    // ลองทุก 4 วินาที รวมไม่เกินราว 2 นาที แต่ละครั้งรอได้ไม่เกิน 30 วินาที (ไม่ส่งซ้อนกัน)
    while (Date.now() - t0 < BOOT_BUDGET) {
      const ctl = new AbortController();
      const limit = setTimeout(() => ctl.abort(), Math.max(5000, Math.min(30000, BOOT_BUDGET - (Date.now() - t0))));
      let d = null;
      try { d = await api('/api/config', { signal: ctl.signal, cache: 'no-store' }); }
      catch (err) { d = null; }
      finally { clearTimeout(limit); }
      if (!d) {
        failed = true;
        showStartup('retrying');
        await sleep(4000);
        continue;
      }
      clearTimeout(wake);
      if (!isNum(d.version) || d.version < 5) { showStartup('version'); return; }
      applyConfig(d);
      showStartup('hide');
      return;
    }
    clearTimeout(wake);
    showStartup('failed');
  } finally {
    booting = false;
  }
}

function applyConfig(d) {
  cfg = { ...DEFAULT_CFG, ...d };
  if (!cfg.seasons || !Object.keys(cfg.seasons).length) cfg.seasons = DEFAULT_CFG.seasons;
  const want = readHash();
  if (!want.year) state.year = cfg.default_year;
  if (cfg.precompute && isNum(cfg.precompute.ready)) precomputeReady = cfg.precompute.ready;
  fillYears();
  buildSeasonSeg();
  buildLayerList();
  renderHelp();
  booted = true;
  loadOverlay();
  loadProvinces();
  loadCoverage();
  if (want.province) selectProvince(want.province);
  if (want.compare) openCompare();
  else if (!want.province) refreshPanel();
  writeHash();
}

// วาดหน้าตั้งต้นทันทีจากค่าในหน้าเว็บ (ไม่ต้องรอเซิร์ฟเวอร์)
fillYears();
buildSeasonSeg();
buildLayerList();
renderLegend();
renderHelp();
fillProvList();
refreshPanel();
boot();
</script>
