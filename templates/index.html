<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="แผนที่ความร้อนเมืองจากข้อมูลดาวเทียม เทียบกรุงเทพมหานครกับขอนแก่น และหาย่านที่ควรปลูกต้นไม้เพิ่ม">
  <meta name="theme-color" content="#fbf8f3">
  <title>แผนที่ความร้อนเมือง · Urban Heat Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --paper: #fbf8f3;
      --panel: #fffdf9;
      --ink: #1d2327;
      --muted: #6b7378;
      --line: #e7e0d5;
      --soft: #f3eee6;
      --primary: #0e5a6a;
      --primary-soft: #e3f0f2;
      --heat: #d1352b;
      --c1: #0e5a6a;
      --c2: #d95f02;
      --shadow: 0 10px 30px rgba(29, 35, 39, .14), 0 2px 6px rgba(29, 35, 39, .08);
      --radius: 14px;
      --gap: 12px;
      --panel-w: clamp(380px, 38vw, 560px);
      --bar-h: 60px;
      --font: 'IBM Plex Sans Thai', system-ui, sans-serif;
      --display: 'Anuphan', 'IBM Plex Sans Thai', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--paper); }
    body { overflow: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .muted { color: var(--muted); }
    .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- แผนที่ ---------- */
    #map { position: absolute; inset: 0; background: #e9e5df; }
    .leaflet-container { font-family: var(--font); }
    .leaflet-top.leaflet-left { margin: 4px 0 0 4px; }
    .leaflet-bar { border: 1px solid var(--line) !important; border-radius: 12px !important; box-shadow: var(--shadow) !important; overflow: hidden; }
    .leaflet-bar a { width: 38px !important; height: 38px !important; line-height: 38px !important; color: var(--ink) !important; background: var(--panel) !important; border-bottom-color: var(--line) !important; display: flex !important; align-items: center; justify-content: center; font-size: 20px; }
    .leaflet-bar a:hover { background: var(--soft) !important; }
    .leaflet-bar a.lg-btn { width: auto !important; padding: 0 12px; font-size: 13px; font-weight: 600; gap: 6px; }
    .lg-ctl { display: none; }
    .leaflet-bottom.leaflet-left { margin-bottom: calc(var(--bar-real, var(--bar-h)) + 2 * var(--gap)); margin-left: 4px; }
    .leaflet-control-attribution { font-size: 10px; background: rgba(255,253,249,.8) !important; border-radius: 6px 0 0 0; }

    #progress { position: absolute; top: 0; left: 0; height: 3px; width: 0; z-index: 1300; background: linear-gradient(90deg, #fdae61, var(--heat)); transition: width .4s ease, opacity .3s; opacity: 0; }
    #progress.on { width: 70%; opacity: 1; transition: width 8s cubic-bezier(.1,.6,.3,1); }
    #progress.done { width: 100%; opacity: 0; }

    .chip { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: 14px; padding: 8px 14px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; }

    /* ---------- หน้าเริ่มต้น ---------- */
    #startup { position: fixed; inset: 0; z-index: 1500; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(251,248,243,.78); animation: fadeIn .3s ease .3s both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #startup .card { width: min(430px, 100%); padding: 26px 26px 24px; text-align: center; }
    #startup .logo { display: inline-flex; align-items: center; gap: 10px; text-align: left; }
    #startup .logo b { display: block; font: 700 17px/1.2 var(--display); }
    #startup .logo small { color: var(--muted); font-size: 11.5px; }
    #startup .spin { margin: 22px auto 4px; }
    #startup h2 { margin: 12px 0 6px; font: 600 17px/1.4 var(--display); }
    #startup p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); white-space: pre-line; }
    #startup .btn-cmp { margin-top: 16px; }

    /* ---------- ชั้นข้อมูล (ขวาบน) ---------- */
    #layers { position: absolute; top: var(--gap); right: var(--gap); z-index: 1250; width: 300px; max-width: calc(100vw - 90px); }
    #layers:not(.collapsed) .layer-body { max-height: calc(100vh - 90px); overflow: auto; }
    #layers.collapsed { width: auto; }
    #layerToggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 10px 12px; border: 0; background: none; border-radius: var(--radius); font-weight: 600; }
    #layerToggle:hover { background: var(--soft); }
    #layers.collapsed #layerToggle .label { display: none; }
    #layerToggle .chev { margin-left: auto; transition: transform .2s; }
    #layers.collapsed .chev { display: none; }
    .layer-body { padding: 0 12px 12px; }
    #layers.collapsed .layer-body { display: none; }
    .layer-opt { display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; align-items: start; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
    .layer-opt:hover { background: var(--soft); }
    .layer-opt.active { background: var(--primary-soft); border-color: #bcdadf; }
    .layer-opt input { margin: 4px 0 0; accent-color: var(--primary); }
    .layer-opt b { font-weight: 600; font-size: 14px; }
    .layer-opt small { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .layer-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
    .layer-foot input[type=range] { flex: 1; accent-color: var(--primary); }

    /* ---------- สัญลักษณ์ (ซ้ายล่าง) ---------- */
    #legend { position: absolute; left: var(--gap); bottom: calc(var(--bar-real, var(--bar-h)) + 2 * var(--gap) + 24px); z-index: 1000; padding: 12px 14px; max-width: 280px; font-size: 12.5px; line-height: 1.5; }
    #legend h4 { margin: 0 0 6px; font: 600 13.5px/1.3 var(--display); }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(29,35,39,.45); }
    #legend .grad { height: 10px; border-radius: 6px; margin: 6px 0 2px; border: 1px solid rgba(29,35,39,.3); }
    #legend .ends { display: flex; justify-content: space-between; color: var(--muted); }
    #legend small { display: block; color: var(--muted); margin-top: 6px; line-height: 1.45; }
    .link { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

    /* ---------- แถบล่าง ---------- */
    #bar { position: absolute; left: var(--gap); right: var(--gap); bottom: var(--gap); z-index: 1100; min-height: var(--bar-h); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
    body.panel-open #bar { right: calc(var(--panel-w) + 2 * var(--gap)); }
    .brand { display: flex; align-items: center; gap: 10px; padding-right: 8px; border-right: 1px solid var(--line); }
    .dot { width: 26px; height: 26px; border-radius: 8px; flex: none; background: conic-gradient(from 200deg, #2b83ba, #abdda4, #ffffbf, #fdae61, #d7191c, #2b83ba); box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
    .brand b { display: block; font: 700 15px/1.15 var(--display); white-space: nowrap; }
    .brand small { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
    .field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .field select, .field input { height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: 14px; }
    .field input { width: 150px; }
    .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--soft); border-radius: 11px; max-width: 100%; }
    .seg button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; color: var(--muted); }
    .seg button:hover { color: var(--ink); }
    .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .quick { display: flex; gap: 4px; }
    .pill { height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0 11px; font-size: 13px; white-space: nowrap; }
    .pill:hover { border-color: var(--primary); color: var(--primary); }
    .tools, .side { display: flex; gap: 4px; align-items: center; }
    .side { gap: 8px; }
    .ibtn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff; border-radius: 10px; color: var(--ink); flex: none; }
    .ibtn:hover { background: var(--soft); }
    .ibtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .side { margin-left: auto; }
    .br { display: none; }
    #status { font-size: 12px; line-height: 1.35; color: var(--muted); min-width: 0; flex: 1 1 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -2px; }
    #status:empty { display: none; }
    #status[data-kind=err] { color: #a3291f; }
    #status[data-kind=warn] { color: #7a5a00; }
    .btn-cmp { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(14,90,106,.28); }
    .btn-cmp:hover { background: #0b4a57; }
    .btn-cmp[aria-pressed=true] { background: var(--ink); box-shadow: none; }
    .btn-cmp .pair { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
    .btn-cmp .pair i { width: 5px; border-radius: 2px; background: #fff; }
    .btn-cmp .pair i:first-child { height: 16px; }
    .btn-cmp .pair i:last-child { height: 10px; background: #f6a96b; }
    .btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-ghost.on { background: var(--primary-soft); border-color: #bcdadf; color: var(--primary); }

    /* ---------- แผงข้อมูล ---------- */
    #panel { position: absolute; right: var(--gap); bottom: var(--gap); z-index: 1101; width: var(--panel-w); height: min(78vh, 720px); display: none; flex-direction: column; overflow: hidden; }
    body.panel-open #panel { display: flex; }
    .handle { display: none; }
    .p-head { padding: 14px 12px 10px 16px; display: flex; gap: 8px; align-items: flex-start; border-bottom: 1px solid var(--line); }
    .p-titles { min-width: 0; flex: 1; }
    .p-head h2 { margin: 0; font: 700 18px/1.3 var(--display); }
    .p-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
    .p-head .ibtn { border: 0; background: none; }
    .p-head .ibtn:hover { background: var(--soft); }
    #btnBack { margin: -4px 0 0 -8px; }
    .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tabs button { border: 0; background: none; padding: 9px 12px; font-size: 14px; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tabs button[aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--heat); }
    .p-body { flex: 1; overflow: auto; padding: 14px 16px 18px; overscroll-behavior: contain; }
    .p-body section + section { margin-top: 18px; }
    .p-body h3 { margin: 0 0 8px; font: 600 14.5px/1.35 var(--display); }
    .p-body h4.sub-h { margin: 16px 0 0; font: 600 13px/1.3 var(--display); color: var(--muted); }
    .lead { font-size: 14px; line-height: 1.6; margin: 0 0 4px; }
    .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
    .empty { padding: 22px 10px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .seg + div { margin-top: 12px; }

    .hero { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 12px; background: var(--soft); }
    .hero .temp { font: 700 34px/1 var(--display); letter-spacing: -.01em; }
    .hero .temp small { font-size: 16px; font-weight: 600; }
    .lvl { display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid rgba(29,35,39,.45); }
    .hero p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }

    .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #ece6dc; border: 1px solid rgba(29,35,39,.28); }
    .stack span { display: block; height: 100%; box-shadow: inset -1px 0 0 rgba(255,255,255,.7); }
    .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
    .keys span { display: inline-flex; align-items: center; gap: 6px; }
    .keys i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid rgba(29,35,39,.45); }

    .prio-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
    .prio-row:first-of-type { border-top: 0; }
    .prio-row > i { width: 12px; height: 12px; border-radius: 4px; margin-top: 5px; border: 1px solid rgba(29,35,39,.4); }
    .prio-row b { font-weight: 600; font-size: 14px; }
    .prio-row .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .prio-row .num { font: 600 14px var(--display); text-align: right; white-space: nowrap; }
    .tag { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 7px 0 5px; border-radius: 999px; background: #e3f1e6; color: #1f6237; font-size: 11.5px; font-weight: 600; vertical-align: 1px; }
    .tag svg { width: 13px; height: 13px; }

    .sens { width: 100%; border-collapse: separate; border-spacing: 4px; margin-top: 4px; }
    .sens th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-align: center; padding: 2px; line-height: 1.3; }
    .sens th[scope=row] { text-align: right; white-space: nowrap; padding-right: 4px; }
    .sens td { text-align: center; background: var(--soft); border-radius: 8px; padding: 6px 4px; font: 600 14px/1.25 var(--display); }
    .sens td small { display: block; font: 400 11px/1.3 var(--font); color: var(--muted); }
    .sens td.def { background: #fdecea; box-shadow: inset 0 0 0 2px var(--heat); }

    .meter { position: relative; height: 12px; border-radius: 6px; background: #ece6dc; margin: 26px 0 4px; border: 1px solid rgba(29,35,39,.2); }
    .meter .fill { height: 100%; border-radius: 6px 0 0 6px; background: #2f7d4a; }
    .meter .target { position: absolute; top: -7px; bottom: -7px; border-left: 2px dashed var(--ink); }
    .meter .target span { position: absolute; bottom: calc(100% + 1px); left: 0; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; }

    .chart-wrap { position: relative; height: 240px; margin-top: 10px; }
    .chart-wrap.sm { height: 150px; }
    .chart-wrap.md { height: 200px; }
    .chart-wrap.tall { height: 270px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .mini { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; color: var(--ink); }
    .mini:hover { border-color: var(--primary); color: var(--primary); }
    .mini svg { width: 15px; height: 15px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
    .tbl th, .tbl td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .tbl th:first-child, .tbl td:first-child { text-align: left; }
    .tbl thead th { color: var(--muted); font-weight: 600; }
    .tbl tr.ref td { font-weight: 600; }
    .tbl tr.dim td { color: var(--muted); }

    .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 34px 10px; color: var(--muted); font-size: 13.5px; text-align: center; }
    .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--heat); animation: spin .8s linear infinite; }
    .spin.sm { width: 16px; height: 16px; border-width: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #efe9df 25%, #f8f4ee 50%, #efe9df 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin: 8px 0; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
    .state > span { flex: 1 1 200px; }
    .state.err { color: #8a2a20; background: #fbeeec; border-radius: 10px; }
    .state.wait { color: #6b5310; background: #fdf6e3; border-radius: 10px; }
    .fastnote { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.4; color: #6b5310; background: #fdf6e3; border: 1px solid #f1e2b3; border-radius: 8px; padding: 5px 9px; margin: 0 0 10px; }
    .fastnote svg { width: 14px; height: 14px; }

    /* ---------- ผลการศึกษา: เทียบ 2 เมือง ---------- */
    #cmpWait .state { margin-bottom: 14px; }
    .cmp-intro { font-size: 13.5px; line-height: 1.6; margin: 0 0 14px; color: var(--muted); }
    .cmp-sec + .cmp-sec { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .cmp-sec h3 { display: flex; align-items: center; gap: 8px; font-size: 15.5px; }
    .cmp-sec h3 .no { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font: 600 12px/1 var(--font); flex: none; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .duo.wide { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
    .city { --c: var(--c1); min-width: 0; padding: 11px 13px 12px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 12px; }
    .city h4 { margin: 0 0 4px; font: 600 14px/1.3 var(--display); color: var(--c); }
    .city .big { font: 700 30px/1.15 var(--display); letter-spacing: -.01em; }
    .city .big small { font-size: 15px; font-weight: 600; }
    .city p { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
    .city p.ink { color: var(--ink); font-size: 13px; }
    .city .warn { color: #7a5a00; }
    .err-inline .warn { color: #8a2a20; }
    .nw { white-space: nowrap; }
    .city .mini { margin-top: 10px; }
    .slopes { margin-top: 8px; font-size: 13px; line-height: 1.55; }
    .slopes div { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
    .slopes i { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
    .bullets { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
    .headline { font-size: 14.5px; line-height: 1.6; margin: 0 0 10px; }

    /* ---------- คำอธิบาย ---------- */
    #help { position: fixed; inset: 0; z-index: 1400; display: none; align-items: center; justify-content: center; background: rgba(29,35,39,.38); padding: 20px; }
    #help.open { display: flex; }
    #help .card { width: min(680px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; overflow: hidden; padding: 0; position: relative; }
    #help .help-scroll { overflow: auto; padding: 22px 26px; overscroll-behavior: contain; }
    #help h2 { margin: 0 0 4px; font: 700 21px/1.3 var(--display); padding-right: 40px; }
    #help h3 { margin: 20px 0 6px; font: 600 15.5px/1.3 var(--display); }
    #help p, #help li { font-size: 14px; line-height: 1.65; }

// ครึ่งความกว้างของช่วงความเชื่อมั่น 95% ของค่าเฉลี่ย = 1.96 · sd / √n
const ciHalf = r => (r && isNum(r.sd) && r.count > 1 ? 1.96 * r.sd / Math.sqrt(r.count) : null);
const ciOf = r => { const h = ciHalf(r); return h == null ? null : { lo: r.mean - h, hi: r.mean + h }; };
const overlaps = (a, b) => !a || !b || !(a.lo > b.hi || b.lo > a.hi);
// ถดถอยเชิงเส้นอย่างง่าย (OLS) คืนความชัน ค่าคลาดเคลื่อนมาตรฐาน และจุดตัดแกน
function ols(pts) {
  const n = pts.length;
  if (n < 5) return null;
  const mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  let sxx = 0, sxy = 0;
  pts.forEach(([x, y]) => { sxx += (x - mx) ** 2; sxy += (x - mx) * (y - my); });
  if (!sxx) return null;
  const b = sxy / sxx, a = my - b * mx;
  const ss = pts.reduce((s, [x, y]) => s + (y - a - b * x) ** 2, 0);
  const se = Math.sqrt(ss / (n - 2) / sxx);
  return { a, b, se, n, x0: pts[0][0], x1: pts[n - 1][0] };
}
const trendText = f => {
  const lo = (f.b - 1.96 * f.se) * 10, hi = (f.b + 1.96 * f.se) * 10;
  const verdict = lo > 0 ? 'ร้อนขึ้นชัดเจน' : hi < 0 ? 'เย็นลงชัดเจน' : 'ยังสรุปไม่ได้ว่าเปลี่ยน';
  return { slope: sgn(f.b * 10, 2), lo: sgn(lo, 2), hi: sgn(hi, 2), verdict };
};

// ปลั๊กอินวาดเส้นช่วงความเชื่อมั่น (whiskers) จาก dataset.whiskers = [{lo, hi}, ...]
Chart.register({
  id: 'whiskers',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx, horiz = chart.options.indexAxis === 'y';
    chart.data.datasets.forEach((ds, di) => {
      if (!Array.isArray(ds.whiskers) || !chart.isDatasetVisible(di)) return;
      const meta = chart.getDatasetMeta(di);
      const vs = chart.scales[horiz ? meta.xAxisID : meta.yAxisID];
      if (!vs) return;
      ctx.save();
      ctx.strokeStyle = ds.whiskerColor || 'rgba(29,35,39,.85)';
      ctx.lineWidth = 1.5;
      meta.data.forEach((el, i) => {
        const w = ds.whiskers[i];
        if (!w || !isNum(w.lo) || !isNum(w.hi) || ds.data[i] == null) return;
        const a = vs.getPixelForValue(w.lo), b = vs.getPixelForValue(w.hi);
        const c = horiz ? el.y : el.x, cap = 5;
        ctx.beginPath();
        if (horiz) {
          ctx.moveTo(a, c); ctx.lineTo(b, c);
          ctx.moveTo(a, c - cap); ctx.lineTo(a, c + cap);
          ctx.moveTo(b, c - cap); ctx.lineTo(b, c + cap);
        } else {
          ctx.moveTo(c, a); ctx.lineTo(c, b);
          ctx.moveTo(c - cap, a); ctx.lineTo(c + cap, a);
          ctx.moveTo(c - cap, b); ctx.lineTo(c + cap, b);
        }
        ctx.stroke();
      });
      ctx.restore();
    });
  }
});

// ปลั๊กอินวาดเส้นแบ่งปีที่เปลี่ยนดาวเทียม (Aqua → VIIRS)
Chart.register({
  id: 'sensorSwitch',
  defaults: { index: null, label: 'เปลี่ยนดาวเทียม' },
  afterDatasetsDraw(chart, args, o) {
    if (!o || o.index == null || o.index < 1) return;
    const x = chart.scales.x, area = chart.chartArea, ctx = chart.ctx;
    if (!x || o.index > x.max) return;
    const px = (x.getPixelForValue(o.index - 1) + x.getPixelForValue(o.index)) / 2;
    ctx.save();
    ctx.strokeStyle = '#6b7378';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '11px ' + Chart.defaults.font.family;
    const w = ctx.measureText(o.label).width;
    ctx.fillStyle = 'rgba(255,253,249,.92)';
    ctx.fillRect(px - w - 8, area.top + 1, w + 6, 16);
    ctx.fillStyle = '#4b5459';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(o.label, px - 5, area.top + 3);
    ctx.restore();
  }
});

// ปลั๊กอินวาดกลุ่มอ้างอิง (ค่าเป็น 0 จึงไม่มีแท่ง): ขีดหนาที่ศูนย์ + ป้าย "กลุ่มอ้างอิง = 0"
Chart.register({
  id: 'refMark',
  defaults: { index: null, label: 'กลุ่มอ้างอิง = 0' },
  afterDatasetsDraw(chart, args, o) {
    if (!o || o.index == null) return;
    const meta = chart.getDatasetMeta(0), el = meta && meta.data[o.index];
    const ys = chart.scales.y, area = chart.chartArea, ctx = chart.ctx;
    if (!el || !ys) return;
    const x = el.x, half = Math.max(8, (el.width || 24) / 2), y0 = ys.getPixelForValue(0);
    const w = (chart.data.datasets[0].whiskers || [])[o.index];
    ctx.save();
    ctx.strokeStyle = '#4b5459';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - half, y0); ctx.lineTo(x + half, y0); ctx.stroke();
    ctx.font = '600 11px ' + Chart.defaults.font.family;
    const slot = half * 2 + 16;
    const lines = ctx.measureText(o.label).width > slot ? o.label.split(' = ').map((t, i) => (i ? '= ' + t : t)) : [o.label];
    const lh = 13, top = Math.min(y0, w && isNum(w.hi) ? ys.getPixelForValue(w.hi) : y0) - 6;
    let y = top - (lines.length - 1) * lh;
    if (y - 10 < area.top) y = Math.max(y0, w && isNum(w.lo) ? ys.getPixelForValue(w.lo) : y0) + 16;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    lines.forEach((t, i) => {
      const tw = ctx.measureText(t).width;
      ctx.fillStyle = 'rgba(255,253,249,.9)';
      ctx.fillRect(x - tw / 2 - 3, y + i * lh - 11, tw + 6, 14);
      ctx.fillStyle = '#1d2327';
      ctx.fillText(t, x, y + i * lh);
    });
    ctx.restore();
  }
});

const NET_MSG = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
class ApiError extends Error {
  constructor(msg, net) { super(msg); this.net = !!net; }
}
const hasThai = m => /[฀-๿]/.test(String(m || ''));
const isAbort = e => !!e && e.name === 'AbortError';
function abortError() {
  try { return new DOMException('aborted', 'AbortError'); } catch (e) { const x = new Error('aborted'); x.name = 'AbortError'; return x; }
}
async function api(url, opts) {
  const signal = opts && opts.signal;
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { if (isAbort(e) || (signal && signal.aborted)) throw abortError(); throw new ApiError(NET_MSG, true); }
  let d = null;
  try { d = await r.json(); } catch (e) { if (signal && signal.aborted) throw abortError(); d = null; }
  if (d == null) throw new ApiError(r.status >= 500 ? 'เซิร์ฟเวอร์ยังไม่พร้อม' : 'เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ', r.status >= 500);
  if (!r.ok) {
    const m = d && d.error;
    if (m && !hasThai(m)) console.warn('API error', url, m);
    throw new ApiError(hasThai(m) ? m : 'เกิดข้อผิดพลาดที่เซิร์ฟเวอร์', r.status >= 502);
  }
  return d;
}
function errMsg(err) {
  const m = (err && err.message) || '';
  return hasThai(m) ? m : 'เกิดข้อผิดพลาด';
}
// ข้อความผิดพลาดใส่ด้วย textContent เสมอ (ไม่ผ่าน innerHTML)
function errorBox(err, what, inline) {
  const box = document.createElement(inline ? 'div' : 'div');
  box.className = inline ? 'err-inline' : 'state err';
  box.setAttribute('role', 'alert');
  const msg = document.createElement(inline ? 'p' : 'span');
  if (inline) msg.className = 'warn';
  msg.textContent = errMsg(err);
  box.appendChild(msg);
  if (what) {
    const b = document.createElement('button');
    b.className = 'mini';
    b.dataset.act = 'retry';
    b.dataset.what = what;
    b.textContent = 'ลองใหม่อีกครั้ง';
    box.appendChild(b);
  }
  return box;
}
function showError(el, err, what) { el.replaceChildren(errorBox(err, what)); }
// ในเทมเพลต HTML ใส่ช่องว่างไว้ก่อน แล้วค่อยเติมข้อความผิดพลาดด้วย textContent
const errSlots = new Map();
let errSlotId = 0;
function errSlot(err, what, inline) {
  const id = 'e' + (++errSlotId);
  errSlots.set(id, { err, what, inline });
  return `<div data-err-slot="${id}"></div>`;
}
function setHTML(el, html) {
  el.innerHTML = html;
  el.querySelectorAll('[data-err-slot]').forEach(n => {
    const e = errSlots.get(n.dataset.errSlot);
    errSlots.delete(n.dataset.errSlot);
    if (e) n.replaceWith(errorBox(e.err, e.what, e.inline)); else n.remove();
  });
}

const ctls = {};
function abortScope(scope) { if (ctls[scope]) { ctls[scope].abort(); ctls[scope] = null; } }
function newCtx(scope) {
  abortScope(scope);
  const ctl = new AbortController();
  ctls[scope] = ctl;
  const snap = { seq, cmpSeq, year: state.year, season: state.season, view: state.view, tab: state.tab, yearView: state.yearView, histView: state.histView, layer: state.layer };
  return {
    signal: ctl.signal,
    snap,
    live() {
      if (ctl.signal.aborted) return false;
      if (scope === 'cmp') return snap.cmpSeq === cmpSeq && cmpOpen() && snap.year === state.year && snap.season === state.season;
      if (scope === 'tiles') return snap.layer === state.layer && snap.year === state.year && snap.season === state.season;
      if (scope === 'shape') return snap.seq === seq;
      return snap.seq === seq && state.view === 'area' && state.tab === snap.tab && snap.season === state.season &&
        (snap.tab === 'history' || snap.year === state.year) &&
        (snap.tab !== 'year' || snap.yearView === state.yearView) &&
        (snap.tab !== 'history' || snap.histView === state.histView);
    }
  };
}

// ข้อมูลของพื้นที่ที่เลือกเก็บไว้ตามพื้นที่ (ล้างเมื่อเปลี่ยนพื้นที่) ข้อมูลเทียบ 2 เมืองเก็บแยก
// เก็บเป็น promise เพื่อไม่ส่งคำขอซ้ำ แต่ไม่ใช้ซ้ำถ้าคำขอนั้นถูกยกเลิกไปแล้ว
let cache = {};
const cmpCache = {};
function getData(name, url, body, ctx, store, keep) {
  store = store || cache;
  const key = name + '|' + JSON.stringify(body);
  const hit = store[key];
  if (hit && !(hit.signal && hit.signal.aborted)) return hit.p;
  const signal = ctx && ctx.signal;
  const entry = { signal };
  entry.p = api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal })
    .then(d => { if (keep && !keep(d) && store[key] === entry) delete store[key]; else entry.signal = null; return d; },
      err => { if (store[key] === entry) delete store[key]; throw err; });
  store[key] = entry;
  return entry.p;
}

// =============================================================== ชั้นข้อมูล
// URL ชั้นแผนที่เก็บไว้ไม่เกิน 30 นาที และผูกกับจำนวนชุดที่คำนวณล่วงหน้าเสร็จแล้ว
// (เมื่อคำนวณล่วงหน้าคืบหน้า จะขอ URL ใหม่ซึ่งเป็นแบบเร็ว)
const TILE_TTL = 30 * 60 * 1000;
const tileCache = {};
let overlay = null;
let overlayMinZoom = null;
let overlayInfo = null;
let tileTimers = [];
let precomputeReady = null;

function layerKey() {
  const def = LAYERS[state.layer];
  return [state.layer, def.year ? state.year : '', def.season ? state.season : '', 'pre' + (precomputeReady == null ? '' : precomputeReady)].join('|');
}
function removeOverlay() {
  tileTimers.forEach(clearTimeout);
  tileTimers = [];
  if (overlay) { map.removeLayer(overlay); overlay = null; }
}

function buildLayerList() {
  const box = $('layerList');
  box.innerHTML = '';
  Object.entries(LAYERS).forEach(([key, def]) => {
    const lab = document.createElement('label');
    lab.className = 'layer-opt' + (key === state.layer ? ' active' : '');
    lab.innerHTML = `<input type="radio" name="layer" value="${key}" ${key === state.layer ? 'checked' : ''}>` +
      `<b>${esc(def.name)}</b><small>${esc(def.desc)}</small>`;
    lab.querySelector('input').addEventListener('change', () => setLayer(key));
    box.appendChild(lab);
  });
}

function setLayer(key) {
  if (!LAYERS[key]) return;
  state.layer = key;
  document.querySelectorAll('#layerList .layer-opt').forEach(el => {
    const inp = el.querySelector('input');
    inp.checked = inp.value === key;
    el.classList.toggle('active', inp.checked);
  });
  if (booted) loadOverlay(); else renderLegend();
  writeHash();
}

function progress(on) {
  const p = $('progress');
  if (on) { p.className = ''; void p.offsetWidth; p.className = 'on'; }
  else { p.className = 'done'; }
}

function updateZoomHint() {
  const need = overlayMinZoom != null ? overlayMinZoom : LAYERS[state.layer].minZoom;
  $('zoomHint').hidden = map.getZoom() >= need;
}
map.on('zoomend', updateZoomHint);
$('zoomHint').addEventListener('click', () => {
  const need = overlayMinZoom != null ? overlayMinZoom : LAYERS[state.layer].minZoom;
  map.setZoom(Math.max(need, map.getZoom() + 1));
});

function tileNote(d) {
  const parts = [];
  if (d.source) parts.push(`อุณหภูมิ ${srcLabel(d.source)} ปี ${d.year} (${seasonShort()})`);
  if (d.dw_year) parts.push(`พื้นผิว Dynamic World ${d.dw_year}` + (state.year < cfg.dw_first_year ? ' (ปีแรกที่มี)' : ''));
  if (d.pop_epoch) parts.push(`ประชากร GHSL ${d.pop_epoch}`);
  if (state.layer === 'plant') parts.unshift('ESA WorldCover 2021');
  if (state.layer === 'built_change') parts.push('GHSL 2005→2020');
  let t = parts.join(' · ') || LAYERS[state.layer].name;
  if (d.fast === false) t = FAST_NOTE + ' · ' + t;
  return t;
}

async function loadOverlay() {
  const key = layerKey();
  const ctx = newCtx('tiles');
  const def = LAYERS[state.layer];
  renderLegend();
  overlayMinZoom = null;
  overlayInfo = null;
  updateZoomHint();
  removeOverlay();
  setStatus('กำลังเตรียมชั้นข้อมูล…');
  progress(true);
  try {
    const hit = tileCache[key];
    let d = hit && Date.now() - hit.t < TILE_TTL ? hit.d : null;
    if (!d) {
      delete tileCache[key];
      const q = new URLSearchParams({ layer: state.layer, year: state.year, season: state.season });
      d = await api('/api/tiles?' + q, { signal: ctx.signal });
      if (!d.url) throw new ApiError('เซิร์ฟเวอร์ไม่ได้ส่งชั้นข้อมูลนี้มา ลองใหม่อีกครั้ง');
      tileCache[key] = { d, t: Date.now() };
    }
    if (!ctx.live()) return;
    overlayInfo = d;
    overlayMinZoom = isNum(d.min_zoom) ? d.min_zoom : def.minZoom;
    updateZoomHint();
    renderLegend(d);
    const opts = { opacity: state.opacity, minZoom: overlayMinZoom, maxZoom: 19 };
    // ชั้นข้อมูลละเอียด 1 กม. ไม่ต้องขอช่องแผนที่ซูมลึกกว่านี้ (ขยายจากระดับ 12 แทน ประหยัดโควตา Earth Engine)
    if (def.nativeMax) opts.maxNativeZoom = def.nativeMax;
    const me = L.tileLayer(d.url, opts);
    overlay = me;
    let failed = 0;
    me.on('loading', () => { if (overlay === me) progress(true); });
    me.on('load', () => { if (overlay === me) progress(false); });
    // ช่องแผนที่ที่คำนวณไม่ทัน ลองโหลดใหม่อัตโนมัติสูงสุด 3 ครั้ง (Earth Engine มักคำนวณต่อจนเสร็จ)
    me.on('tileerror', e => {
      if (overlay !== me) return;
      const img = e.tile;
      const tries = +(img.dataset.tries || 0);
      if (tries < 3) {
        img.dataset.tries = tries + 1;
        const url = img.src;
        const id = setTimeout(() => {
          tileTimers = tileTimers.filter(x => x !== id);
          if (overlay !== me || !img.isConnected) return;
          img.src = '';
          img.src = url;
        }, 2500 * (tries + 1));
        tileTimers.push(id);
        return;
      }
      if (failed++ === 0) setStatus('บางช่องของแผนที่ยังคำนวณไม่เสร็จ ลองซูมเข้า หรือรอสักครู่แล้วเลื่อนแผนที่', 'warn');
    });
    me.addTo(map);
    if (map.getZoom() < overlayMinZoom) progress(false);
    setStatus(tileNote(d), d.fast === false ? 'warn' : '');
  } catch (err) {
    if (isAbort(err) || !ctx.live()) return;
    progress(false);
    setStatus(errMsg(err) + ' · ลองเลือกชั้นข้อมูลอีกครั้ง', 'err');
  }
}

function loading(el, text) {
  el.innerHTML = `<div class="loader"><div class="spin"></div><div class="lt">${esc(text)}</div></div>`;
  const t0 = Date.now();
  const lt = el.querySelector('.lt');
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (lt.isConnected) lt.textContent = `${text} · ${s} วินาที`; else clearInterval(timer);
  }, 1000);
  return () => clearInterval(timer);
}

async function appendValidation(el, ctx) {

    const v = await getData('validate', '/api/validate', { ...state.focus.payload, season: ctx.snap.season }, ctx);
    if (!ctx.live() || !el || !el.isConnected || !v.ready || !v.count || !isNum(v.mean)) return;
    const yrs = v.years || cfg.check_years, by = v.bias_years || cfg.bias_years;
    el.insertAdjacentHTML('beforeend', `<p class="note">ตรวจสอบการปรับเทียบ VIIRS: ปรับเทียบจาก${v.method === 'paired' ? 'วันที่สองดาวเทียมวัดตรงกัน' : 'ช่วงที่สองดาวเทียมทำงานพร้อมกัน'}ในปี ${by[0]}–${by[1]} แล้วทดสอบกับปี ${yrs[0]}–${yrs[1]} ซึ่งไม่ได้ใช้ตอนปรับ ค่า VIIRS ที่ปรับแล้วต่างจาก Aqua เฉลี่ย ${sgn(v.mean)} °C (คลาดเคลื่อนเฉลี่ยรายช่อง ${isNum(v.mae) ? num(v.mae) : '–'} °C) ในย่านที่มีคนอยู่ของพื้นที่นี้</p>`);
  } catch (err) { /* หมายเหตุเสริม ไม่จำเป็นต้องแจ้งเมื่อโหลดไม่ได้ */ }
}

async function loadOverview() {
  const ctx = newCtx('area'), el = $('tab-overview');
  const stop = loading(el, 'กำลังคำนวณภาพรวมของพื้นที่');
  el.insertAdjacentHTML('beforeend', '<div class="skel" style="width:70%"></div><div class="skel"></div><div class="skel" style="width:85%"></div>');
  try {
    const d = await getData('summary', '/api/summary', { ...state.focus.payload, year: ctx.snap.year, season: ctx.snap.season }, ctx);
    if (!ctx.live() || !matches(d, ctx)) return;
    last.summary = d;

  } catch (err) {

}

const levelChip = lv => `<span class="lvl" style="background:${cfg.lst_palette[lv]};color:${textOn(cfg.lst_palette[lv])}">${LEVEL_NAMES[lv]}</span>`;
function prioOf(d) {
  const p = Array.isArray(d.prio) ? d.prio : [];
  const get = i => {
    const r = p.find(x => x && x.cls === i) || p[i] || {};
    return { people: r.people || 0, area_km2: r.area_km2 || 0, plant_km2: r.plant_km2 || 0 };
  };
  const p1 = get(1), p2 = get(2), p3 = get(3);
  return { p1, p2, p3, uA: p2.area_km2 + p3.area_km2, uP: p2.people + p3.people };
}
// สัดส่วนคิดจากผู้อยู่อาศัยทั้งหมด (pop_total) ส่วนที่อยู่ในช่องไม่มีข้อมูลอุณหภูมิแยกไว้ต่างหาก
function hotPeople(d) {
  const ex = Array.isArray(d.expo) ? d.expo : [];
  const classified = ex.reduce((a, r) => a + (r.people || 0), 0);
  const hot = ex.filter(r => r.level >= cfg.hot_level).reduce((a, r) => a + (r.people || 0), 0);
  const total = Math.max(isNum(d.pop_total) ? d.pop_total : 0, classified);
  const noData = Math.max(0, total - classified);
  return { ex, classified, hot, total, noData, pct: pctOf(hot, total), noDataPct: pctOf(noData, total), showNoData: total > 0 && noData / total >= 0.005 };
}
const pctText = p => (p < 1 ? 'ไม่ถึง 1' : String(p));

function renderOverview(d) {
  const red = cfg.prio_colors[1], amber = cfg.prio_colors[0];
  let html = fastNote(d);

  // อุณหภูมิในย่านที่มีคนอยู่
  if (isNum(d.lst_lived)) {
    html += `<section class="hero"><div><div class="temp">${num(d.lst_lived)}<small> °C</small></div>${levelChip(levelOf(d.lst_lived))}</div>
      <p>อุณหภูมิพื้นผิวช่วงบ่ายเฉลี่ย<br>ในย่านที่มีคนอยู่ (${esc(seasonShort())} ปี ${d.year})</p></section>`;
  } else {
    html += `<section class="hero"><p>ไม่มีข้อมูลอุณหภูมิในย่านที่มีคนอยู่ อาจเพราะเมฆบังเกือบทั้งช่วง หรือพื้นที่นี้แทบไม่มีคนอาศัย${state.season === 'wet' ? ' (หน้าฝนมีเมฆมาก ลองเลือกทั้งปีหรือฤดูอื่น)' : ''}</p></section>`;
  }

  // ย่านที่ควรปรับปรุง
  const { p1, p2, p3, uA, uP } = prioOf(d);
  let lead;
  if (uA >= 0.5) {
    lead = `พบย่านเร่งด่วนราว <b>${km2(uA)} ตร.กม.</b> มีคนอยู่ราว <b>${nfP(uP)}</b>`;
    if (p3.area_km2 >= 0.5) lead += ` ในนี้ <b>${km2(p3.area_km2)} ตร.กม.</b> มีพื้นที่ปลูกต้นไม้เพิ่มได้ (ที่ว่างรวมราว ${km2(p3.plant_km2)} ตร.กม.)`;
    if (p2.area_km2 >= 0.5) lead += ` ส่วนอีก ${km2(p2.area_km2)} ตร.กม. แทบไม่มีที่ว่าง ต้องใช้วิธีอื่น เช่น ต้นไม้ริมถนน หลังคาเขียว หรือหลังคาสีอ่อน`;
  } else if (p1.area_km2 >= 0.5) {
    lead = `ยังไม่พบย่านที่เข้าเกณฑ์เร่งด่วน แต่มี <b>${km2(p1.area_km2)} ตร.กม.</b> ที่ผิวร้อนและมีคนอยู่ ควรเฝ้าระวัง (คนราว ${nfP(p1.people)})`;
  } else {
    lead = 'ไม่พบย่านที่เข้าเกณฑ์ในปีและฤดูนี้';
  }
  const row = (color, title, sub, n) =>
    `<div class="prio-row"><i style="background:${color}"></i><b>${title}</b><span class="num">${n}</span><span class="sub">${sub}</span></div>`;
  html += `<section><h3>ย่านที่ควรปรับปรุง</h3><p class="lead">${lead}</p>
    ${row(red, `เร่งด่วน · มีพื้นที่ปลูกต้นไม้เพิ่มได้<span class="tag">${TREE_SVG}ปลูกได้</span>`, `คนราว ${nfP(p3.people)} · ที่ว่างรวม ${km2(p3.plant_km2)} ตร.กม.`, `${km2(p3.area_km2)} ตร.กม.`)}
    ${row(red, 'เร่งด่วน · ไม่มีที่ว่างปลูก', `คนราว ${nfP(p2.people)} · ใช้ต้นไม้ริมถนน หลังคาเขียว หรือหลังคาสีอ่อนแทน`, `${km2(p2.area_km2)} ตร.กม.`)}
    ${row(amber, 'เฝ้าระวัง', `ผิวร้อนเกิน ${cfg.hot} °C และมีคนอยู่ · คนราว ${nfP(p1.people)}`, `${km2(p1.area_km2)} ตร.กม.`)}
  </section>`;

  html += sensTable(d);
  html += coverSection(d);
  html += peopleSection(d);

  html += `<div id="ovNotes"><p class="note">อุณหภูมิจากดาวเทียม ${esc(srcLabel(d.source))} เฉพาะวันฟ้าโปร่ง · พื้นที่ที่เลือกราว ${isNum(d.area_km2) ? nf(d.area_km2) : '–'} ตร.กม.</p></div>
    <div class="actions"><button class="mini" data-act="csv" data-what="overview">${CSV_SVG}ดาวน์โหลด CSV</button></div>`;
  return html;
}

function sensTable(d) {
  const S = Array.isArray(d.sensitivity) ? d.sensitivity : [];
  if (!S.length) return '';
  const T = cfg.sens_temps, G = cfg.sens_greens;
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const find = (t, g) => S.find(r => near(r.t, t) && near(r.g, g));
  const body = T.map(t => `<tr><th scope="row">${t} °C</th>${G.map(g => {
    const r = find(t, g);
    const def = near(t, cfg.very_hot) && near(g, cfg.green_low);
    const ppl = r && isNum(r.people) ? nfP(r.people) : '';
    return `<td class="${def ? 'def' : ''}" title="${esc(ppl ? 'คนราว ' + ppl : '')}">${r && isNum(r.area_km2) ? km2(r.area_km2) : '–'}<small>${ppl}</small></td>`;
  }).join('')}</tr>`).join('');
  return `<section><h3>ความไวของผลต่อเกณฑ์</h3>
    <p class="note" style="margin:0">ย่านเร่งด่วนกว้างเท่าไร (ตร.กม. และจำนวนคน) ถ้าเปลี่ยนเกณฑ์ความร้อนหรือพื้นที่สีเขียว · กรอบแดงคือเกณฑ์ที่ใช้บนแผนที่</p>
    <table class="sens"><thead><tr><th scope="col">ผิวร้อนเกิน</th>${G.map(g => `<th scope="col">สีเขียวน้อยกว่า ${Math.round(g * 100)}%</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></section>`;
}

function coverSection(d) {
  const lived = d.cover_lived || {}, all = d.cover_all || {};
  const useLived = COVER.some(([k]) => isNum(lived[k]));
  const c = useLived ? lived : all;
  if (!COVER.some(([k]) => isNum(c[k]))) return '';
  const scope = useLived ? 'ในย่านที่มีคนอยู่' : 'ในพื้นที่ที่เลือก';
  const raw = k => (isNum(c[k]) ? Math.max(0, c[k]) : 0);
  const tot = COVER.reduce((a, [k]) => a + raw(k), 0);
  const v = k => raw(k) / Math.max(1, tot);
  const other = Math.max(0, 1 - tot);
  const segs = COVER.map(([k, n, col]) => `<span style="width:${(v(k) * 100).toFixed(2)}%;background:${col}" title="${n} ${Math.round(v(k) * 100)}%"></span>`).join('') +
    (other > 0.005 ? `<span style="width:${(other * 100).toFixed(2)}%;background:#ddd6cb" title="อื่น ๆ ${Math.round(other * 100)}%"></span>` : '');
  const keys = COVER.map(([k, n, col]) => `<span><i style="background:${col}"></i>${n} ${Math.round(v(k) * 100)}%</span>`).join('') +
    (other > 0.005 ? `<span><i style="background:#ddd6cb"></i>อื่น ๆ ${Math.round(other * 100)}%</span>` : '');
  const tree = v('TREES') * 100;
  const how = d.cover_method === 'prob'
    ? 'ค่าเฉลี่ยความน่าจะเป็นของแต่ละประเภทตลอดปี (ชุดข้อมูลเดิม ระหว่างเตรียมชุดใหม่)'
    : 'นับจากประเภทพื้นผิวที่พบบ่อยที่สุดของปีในแต่ละจุด แล้วรวมเป็นช่อง ≈1 กม.';
  return `<section><h3>พื้นผิว${scope}</h3><div class="stack">${segs}</div><div class="keys">${keys}</div>
    <div class="meter" aria-hidden="true"><div class="fill" style="width:${Math.min(100, tree).toFixed(1)}%"></div><div class="target" style="left:30%"><span>30%</span></div></div>
    <p class="lead" style="font-size:13.5px;margin-top:4px">ร่มไม้ (ต้นไม้) ${scope} <b>${Math.round(tree)}%</b> — หลัก 3-30-300 แนะนำอย่างน้อย 30%</p>
    <p class="note" style="margin-top:2px">${how} · Dynamic World ปี ${esc(d.dw_year)}</p></section>`;
}

const NODATA_COLOR = '#d9d4cc';
function peopleSection(d) {
  const { ex, classified, hot, total, noData, pct, noDataPct, showNoData } = hotPeople(d);
  if (classified < 1) return '';
  const pal = cfg.lst_palette;
  const w = n => (n / total * 100).toFixed(2);
  const segs = ex.map(r => `<span style="width:${w(r.people || 0)}%;background:${pal[r.level]}" title="${LEVEL_NAMES[r.level]}: ${nfP(r.people)}"></span>`).join('') +
    (showNoData ? `<span style="width:${w(noData)}%;background:${NODATA_COLOR}" title="ไม่มีข้อมูลอุณหภูมิ: ${nfP(noData)}"></span>` : '');
  const keys = ex.filter(r => r.people >= 1).map(r => `<span><i style="background:${pal[r.level]}"></i>${LEVEL_NAMES[r.level]} ${pctText(pctOf(r.people, total))}%</span>`).join('') +
    (showNoData ? `<span><i style="background:${NODATA_COLOR}"></i>ไม่มีข้อมูลอุณหภูมิ ${pctText(noDataPct)}%</span>` : '');
  return `<section><h3>ผู้คนกับความร้อน</h3>
    <p class="lead">ผู้อยู่อาศัยราว ${nfP(total)} ในจำนวนนี้ <b>${nfP(hot)} (${pctText(pct)}%)</b> อยู่ในย่านที่${LEVEL_NAMES[cfg.hot_level]}ขึ้นไป (ผิวเกิน ${cfg.very_hot} °C ช่วงบ่าย)${showNoData ? ` · อีก ${pctText(noDataPct)}% อยู่ในช่องที่ไม่มีข้อมูลอุณหภูมิ (เช่น เมฆบัง)` : ''}</p>
    <div class="stack">${segs}</div><div class="keys">${keys}</div>
    <p class="note">ประชากรจาก GHSL เป็นการประมาณผู้อยู่อาศัยจริง (รวมผู้ไม่ได้ย้ายทะเบียนบ้าน) จึงมากกว่าตัวเลขทะเบียนราษฎร์ · ปี ${esc(d.pop_epoch)} · เป็นการสัมผัสความร้อน ไม่ใช่จำนวนผู้ป่วย</p></section>`;
}

// ---------- แผนภูมิแท่งเทียบกลุ่ม (ใช้ร่วมหลายแท็บ) ----------
function chartActions(keys, csvWhat, names) {
  return '<div class="actions">' + keys.map((k, i) => `<button class="mini" data-act="png" data-chart="${k}">${PNG_SVG}บันทึกรูป${names ? names[i] : ''}</button>`).join('') +
    (csvWhat ? `<button class="mini" data-act="csv" data-what="${csvWhat}">${CSV_SVG}ดาวน์โหลด CSV</button>` : '') + '</div>';
}
function valueRange(vals, step = 0.5) {
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  return { min: lo < 0 ? Math.floor((lo - 0.05) / step) * step : 0, max: hi > 0 ? Math.ceil((hi + 0.05) / step) * step : 0 };
}

// ---------- แท็บ: ปีที่เลือก ----------
async function loadYear() {
  const ctx = newCtx('area');
  killChart('year');
  const stop = loading($('yearOut'), 'กำลังเทียบอุณหภูมิในแต่ละกลุ่ม');
  try {
    const d = await getData('bins', '/api/bins', { ...state.focus.payload, year: ctx.snap.year, season: ctx.snap.season }, ctx);
    if (!ctx.live() || !matches(d, ctx)) return;
    last.bins = d;
    renderYear(d);
  } catch (err) {
    if (!isAbort(err) && ctx.live()) showError($('yearOut'), err, 'area');
  } finally { stop(); }
}

function renderYear(d) {
  const view = state.yearView, el = $('yearOut');
  const what = view === 'green' ? 'พื้นที่สีเขียว' : 'สิ่งปลูกสร้าง';
  const rows = (Array.isArray(d[view]) ? d[view] : []).map((r, i) => ({ ...r, i }));
  const shown = rows.filter(r => isNum(r.mean) && r.count >= N_SHOW);
  const good = shown.filter(r => r.count >= N_SENT);
  killChart('year');
  const table = (ref) => `<table class="tbl"><thead><tr><th scope="col">กลุ่ม (${what})</th><th scope="col">อุณหภูมิเฉลี่ย °C</th><th scope="col">ช่อง (n)</th></tr></thead><tbody>${
    rows.map(r => {
      const ok = isNum(r.mean) && r.count >= N_SHOW;
      return `<tr class="${ref && r.i === ref.i ? 'ref' : ok ? '' : 'dim'}"><td>${esc(r.label)}${ref && r.i === ref.i ? ' <span class="muted">(อ้างอิง)</span>' : ''}</td><td>${ok ? num(r.mean) : '–'}</td><td>${nf(r.count || 0)}</td></tr>`;
    }).join('')}</tbody></table>`;
  if (good.length < 2) {
    el.innerHTML = fastNote(d) + `<div class="empty">ย่านที่มีคนอยู่ในพื้นที่นี้มีน้อยเกินไปสำหรับเปรียบเทียบอย่างน่าเชื่อถือ<br>(ต้องมีอย่างน้อย 2 กลุ่มที่มี ${N_SENT} ช่องขึ้นไป)<br>ลองเลือกจังหวัด หรือวาดพื้นที่ให้กว้างขึ้น${state.season === 'wet' ? '<br>หน้าฝนมีเมฆมาก ลองเลือกทั้งปีหรือฤดูอื่น' : ''}</div>` + table(null);
    return;
  }
  // กลุ่มอ้างอิง: สิ่งปลูกสร้างน้อยที่สุด / พื้นที่สีเขียวมากที่สุด ที่มีอย่างน้อย 20 ช่อง
  const ref = view === 'built' ? good[0] : good[good.length - 1];
  const far = view === 'built' ? good[good.length - 1] : good[0];
  const diff = far.mean - ref.mean;
  const sep = !overlaps(ciOf(far), ciOf(ref));
  const lead = `ปี ${d.year} (${esc(seasonShort())}) ย่านที่มี${what} <b>${esc(far.label)}</b> ${diff >= 0 ? 'ร้อนกว่า' : 'เย็นกว่า'}ย่านที่มี${what} <b>${esc(ref.label)}</b> อยู่ <b>${num(Math.abs(diff))} °C</b> (${num(far.mean)} เทียบกับ ${num(ref.mean)} °C) · ` +
    (sep ? '<b>ต่างกันชัดเจน</b> (ช่วงความเชื่อมั่นไม่ซ้อนกัน)' : '<b>ยังแยกไม่ชัด</b> (ช่วงความเชื่อมั่นซ้อนกัน)');
  const data = shown.map(r => r.mean - ref.mean);
  const whiskers = shown.map(r => { const c = ciOf(r); return c && { lo: c.lo - ref.mean, hi: c.hi - ref.mean }; });
  const ext = whiskers.flatMap((w, i) => (w ? [w.lo, w.hi] : [data[i]]));
  const rng = valueRange(ext);
  el.innerHTML = fastNote(d) + `<p class="lead">${lead}</p>
    <div class="chart-wrap"><canvas id="yearChart" role="img" aria-label="แผนภูมิแท่ง อุณหภูมิของแต่ละกลุ่มเทียบกับกลุ่มอ้างอิง"></canvas></div>
    ${chartActions(['year'], 'year')}
    ${table(ref)}
    <p class="note">เฉพาะย่านที่มีคนอยู่ (${nf(cfg.pop_any)} คน/ตร.กม. ขึ้นไป) · อุณหภูมิ ${esc(srcLabel(d.source))} · พื้นผิว Dynamic World ${esc(d.dw_year)} · กลุ่มที่มีไม่ถึง ${N_SHOW} ช่องไม่แสดงในกราฟ ประโยคสรุปใช้เฉพาะกลุ่มที่มี ${N_SENT} ช่องขึ้นไป · เป็นความสัมพันธ์ ไม่ได้พิสูจน์สาเหตุ</p>
    <p class="note">เส้นขีดคือช่วงความเชื่อมั่น 95% ของค่าเฉลี่ยแต่ละกลุ่ม · ${CI_NOTE}</p>`;
  const narrow = $('yearOut').clientWidth < 460;
  const tick = r => [...(narrow ? String(r.label).split(' ') : [r.label]), 'n=' + nf(r.count), ...(r.i === ref.i ? ['(อ้างอิง)'] : [])];
  drawChart('year', 'yearChart', {
    type: 'bar',
    data: {
      labels: shown.map(tick),
      datasets: [{
        label: 'ร้อนกว่ากลุ่มอ้างอิง (°C)', data, whiskers,
        backgroundColor: shown.map((r, i) => (r.i === ref.i ? '#c9cdd0' : data[i] >= 0 ? '#ec9a7e' : '#8fbcd9')),
        borderColor: 'rgba(29,35,39,.45)', borderWidth: 1, borderRadius: 6, borderSkipped: false, maxBarThickness: 54
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        refMark: { index: shown.findIndex(r => r.i === ref.i) },
        tooltip: { callbacks: {
          label: ctx => (shown[ctx.dataIndex].i === ref.i ? 'กลุ่มอ้างอิง (= 0)' : `${sgn(data[ctx.dataIndex])} °C เทียบกลุ่มอ้างอิง`),
          afterLabel: ctx => { const r = shown[ctx.dataIndex], w = whiskers[ctx.dataIndex]; return `เฉลี่ย ${num(r.mean)} °C · ${nf(r.count)} ช่อง` + (w ? `\nช่วงความเชื่อมั่น 95%: ${sgn(w.lo)} ถึง ${sgn(w.hi)} °C` : ''); }
        } }
      },
      scales: {
        y: { beginAtZero: true, min: rng.min, max: rng.max, title: { display: true, text: 'ร้อนกว่ากลุ่มอ้างอิง (°C)' }, grid: { color: c => (c.tick.value === 0 ? '#8d969b' : '#efe9e0') } },
        x: { title: { display: true, text: `สัดส่วน${what}ในช่อง 1 กม.` }, grid: { display: false }, ticks: { maxRotation: 0, autoSkip: false, font: { size: 11 } } }
      }
    }
  }, { title: `อุณหภูมิพื้นผิวเทียบกลุ่มอ้างอิง แยกตาม${what}`, sub: `${regionName()} · ปี ${d.year} · ${seasonFull()} · เส้นขีด = ช่วงความเชื่อมั่น 95%`, file: `year_${view}` });
}

// ---------- แท็บ: ย้อนหลัง 20 ปี ----------
async function loadHistory() {
  const ctx = newCtx('area'), view = ctx.snap.histView;
  ['history', 'hist2'].forEach(killChart);
  const stop = loading($('histOut'), 'กำลังดึงข้อมูลย้อนหลัง 20 ปี');
  try {
    const d = await getData(view, '/api/' + view, { ...state.focus.payload, season: ctx.snap.season }, ctx);
    if (!ctx.live() || d.season !== ctx.snap.season) return;
    last[view] = d;
    if (view === 'trend') { renderTrend(d); appendValidation($('histNotes'), ctx); } else renderChange(d);
  } catch (err) {
    if (!isAbort(err) && ctx.live()) showError($('histOut'), err, 'area');
  } finally { stop(); }
}

function yearAxis() {
  const ys = [];
  for (let y = cfg.first_year; y <= cfg.last_year; y++) ys.push(y);
  return ys;
}
const isViirsYear = y => y > cfg.aqua_last_year;

function renderTrend(d) {
  const el = $('histOut');
  const rows = (Array.isArray(d.rows) ? d.rows : []).filter(r => r && isNum(r.year));
  ['history', 'hist2'].forEach(killChart);
  if (!rows.some(r => isNum(r.lst))) {
    el.innerHTML = fastNote(d) + '<div class="empty">ไม่มีข้อมูลอุณหภูมิในย่านที่มีคนอยู่ของพื้นที่นี้ ลองเลือกพื้นที่ที่กว้างขึ้น</div>';
    return;
  }
  const years = yearAxis();
  rows.forEach(r => { if (!years.includes(r.year)) years.push(r.year); });
  years.sort((a, b) => a - b);
  const byYear = Object.fromEntries(rows.map(r => [r.year, r]));
  const viirs = y => (byYear[y] ? byYear[y].source === 'VIIRS' : isViirsYear(y));
  const aqua = rows.filter(r => isNum(r.lst) && r.source !== 'VIIRS' && r.year <= cfg.aqua_last_year);
  const fit = ols(aqua.map(r => [r.year, r.lst]));
  const built = (Array.isArray(d.built) ? d.built : []).filter(b => b && isNum(b.built));
  let lead = 'ข้อมูลรายปีไม่พอสำหรับคำนวณแนวโน้ม';
  if (fit) {
    const t = trendText(fit);
    lead = `ปี ${fit.x0}–${fit.x1} อุณหภูมิพื้นผิวช่วงบ่ายในย่านที่มีคนอยู่มีแนวโน้ม <b>${t.slope} °C ต่อ 10 ปี</b> (ช่วงความเชื่อมั่น 95%: ${t.lo} ถึง ${t.hi}) · <b>${t.verdict}</b>`;
  }
  if (built.length >= 2) {
    const a = built[0], b = built[built.length - 1];
    lead += ` ส่วนสัดส่วนอาคาร${b.built >= a.built ? 'เพิ่ม' : 'ลด'}จาก ${num(a.built)}% (${a.epoch}) เป็น ${num(b.built)}% (${b.epoch})`;
  }
  const sw = years.findIndex(y => viirs(y));
  el.innerHTML = fastNote(d) + `<p class="lead">${lead}</p>

// แผนภูมิแท่งแนวนอน: อุณหภูมิที่เปลี่ยนไป แยกตามระดับที่อาคารเพิ่ม (ใช้ทั้งแท็บย้อนหลังและหน้าเทียบ 2 เมือง)

}
function changeChartConfig(d, rng) {

        } }

        y: { grid: { display: false }, ticks: { font: { size: 11 } } }

// รวมสองกลุ่มเป็นกลุ่มเดียว (ค่าเฉลี่ยถ่วงน้ำหนัก และส่วนเบี่ยงเบนมาตรฐานรวมทั้งภายในและระหว่างกลุ่ม)
function poolRows(a, b) {
  const ok = r => r && isNum(r.mean) && r.count > 0;
  if (!ok(a) || !ok(b)) return ok(a) ? a : ok(b) ? b : null;
  const n = a.count + b.count, m = (a.count * a.mean + b.count * b.mean) / n;
  if (!isNum(a.sd) || !isNum(b.sd) || n < 2) return { mean: m, count: n };
  const ss = (a.count - 1) * a.sd * a.sd + (b.count - 1) * b.sd * b.sd + a.count * (a.mean - m) ** 2 + b.count * (b.mean - m) ** 2;
  return { mean: m, count: n, sd: Math.sqrt(ss / (n - 1)) };
}
function changeSentence(d) {
  const rows = Array.isArray(d.rows) ? d.rows : [];
  const c = rows[0];
  let b = rows[3], what = 'ย่านที่อาคารเพิ่มมาก', pre = '';
  const enough = r => r && isNum(r.mean) && r.count >= N_SENT;
  // เมืองที่โตช้า (เช่น ขอนแก่น) กลุ่ม “อาคารเพิ่มมาก” มักมีช่องน้อย จึงรวมกับกลุ่มปานกลาง (อาคารเพิ่ม ≥ 4 จุด)
  if (enough(c) && !enough(b)) {
    const p = poolRows(rows[2], rows[3]);
    if (enough(p)) {
      pre = `กลุ่มอาคารเพิ่มมากมีไม่ถึง ${N_SENT} ช่อง จึงรวมกับกลุ่มปานกลาง (อาคารเพิ่ม ≥ 4 จุด รวม ${nf(p.count)} ช่อง): `;
      b = p; what = 'ย่านที่อาคารเพิ่ม';
    }
  }
  if (!enough(c) || !enough(b)) {
    return `กลุ่มเทียบหรือกลุ่มที่อาคารเพิ่มมีไม่ถึง ${N_SENT} ช่อง จึงยังไม่สรุปผล`;
  }
  const diff = b.mean - c.mean;
  const sep = !overlaps(ciOf(b), ciOf(c));
  // ค่าที่เล็กมากใช้ทศนิยม 2 ตำแหน่ง ไม่ให้อ่านเป็น “0.1 กับ 0.1 ต่างกัน +0.1”
  const dp = Math.max(Math.abs(b.mean), Math.abs(c.mean), Math.abs(diff)) < 0.5 ? 2 : 1;
  return pre + `${what}${b.mean >= 0 ? 'ร้อนขึ้น' : 'เย็นลง'} <b>${num(Math.abs(b.mean), dp)} °C</b> ส่วนกลุ่มเทียบ${c.mean >= 0 ? 'ร้อนขึ้น' : 'เย็นลง'} ${num(Math.abs(c.mean), dp)} °C ` +
    `ส่วนต่าง <b>${sgn(diff, dp)} °C</b> · ${sep ? '<b>ต่างกันชัดเจน</b>' : '<b>ยังแยกไม่ชัด</b> (ช่วงความเชื่อมั่นซ้อนกัน)'}`;
}
const CONTROL_NOTE = 'กลุ่มเทียบ = ไม่มีอาคาร ไม่เปลี่ยน และอยู่ห่างย่านที่สร้างใหม่ ≥ 2 กม.';

async function fetchCmp(kind, city, ctx) {
  const { year, season } = ctx.snap;
  const body = kind === 'summary' ? { province: city.en, year, season } : { province: city.en, season };
  cmp[kind][city.en] = { st: 'load' };
  renderCmp(kind);
  try {
    const d = await getData(kind, '/api/' + kind, body, ctx, cmpCache, kind === 'suhi' ? (r => r && r.ready !== false) : null);
    if (!ctx.live()) return;
    if (kind === 'suhi' && d.ready === false) {
      cmp.suhi[city.en] = { st: 'wait', d };
      scheduleSuhiRetry(ctx);
    } else if (d.season !== undefined && d.season !== season) {
      cmp[kind][city.en] = { st: 'err', err: new ApiError('ข้อมูลที่ได้ไม่ตรงกับฤดูที่เลือก ลองใหม่อีกครั้ง') };
    } else {
      cmp[kind][city.en] = { st: 'ok', d };
    }
  } catch (err) {
    if (isAbort(err) || !ctx.live()) return;
    cmp[kind][city.en] = { st: 'err', err };
  }
  renderCmp(kind);
}
// ข้อมูลเทียบ 2 เมืองยังเตรียมไม่เสร็จ: ลองใหม่ทุก 60 วินาทีระหว่างที่ยังเปิดหน้านี้อยู่
function scheduleSuhiRetry(ctx) {
  if (suhiTimer) return;
  suhiTimer = setTimeout(() => {
    suhiTimer = null;
    if (!ctx.live()) return;
    cmpCities().forEach(c => { if ((cmp.suhi[c.en] || {}).st === 'wait') fetchCmp('suhi', c, ctx); });
  }, 60000);
}

function renderCmp(kind) {
  if (!$('cmpCards')) return;
  if (kind === 'suhi') { renderCmpWait(); renderCmpCards(); renderCmpTrend(); }
  else if (kind === 'change') renderCmpChange();
  else { renderCmpPeople(); renderCmpPlant(); }
}
const slotOf = (kind, c) => cmp[kind][c.en] || { st: 'load' };
const skel = () => '<div class="skel" style="width:60%;height:24px"></div><div class="skel"></div><div class="skel" style="width:80%"></div>';

  const prog = isNum(p.ready) && isNum(p.total) ? ` (${p.ready}/${p.total} ชุด)` : '';
  $('cmpWait').innerHTML = '<div class="state wait" role="status"><div class="spin sm"></div><span></span></div>';
  $('cmpWait').querySelector('span').textContent = `ข้อมูลสำหรับเทียบสองเมืองกำลังเตรียมอยู่${prog} ระบบจะลองใหม่ทุก 1 นาที ระหว่างนี้ดูหัวข้อ 3–5 ได้ก่อน`;
}

    else {
      const r = rowOfYear(s.d, state.year);
      if (!r || !isNum(r.suhii)) body = `<p>ปี ${state.year} มีข้อมูลไม่พอ (อาจมีเมฆมาก) ลองเลือกปีหรือฤดูอื่น</p>`;
      else {
        vals.push([c, r]);
        const small = (r.n_urban || 0) < N_SENT || (r.n_rural || 0) < N_SENT;
        body = `<div class="big">${sgn(r.suhii)}<small> °C</small></div>
          <p class="ink"><span class="nw">เมือง ${isNum(r.urban) ? num(r.urban) : '–'} °C</span> · <span class="nw">ชนบท ${isNum(r.rural) ? num(r.rural) : '–'} °C</span></p>
          <p><span class="nw">${nf(r.n_urban || 0)} ช่องในเมือง</span> · <span class="nw">${nf(r.n_rural || 0)} ช่องชนบท</span> · <span class="nw">${esc(srcLabel(r.source))}</span></p>` +
          (s.d.urban_def === 'cluster' ? '<p class="warn">เขตเมืองหลักมีน้อย จึงใช้เขตเมืองที่กว้างขึ้น (urban cluster) แทน</p>' : '') +
          (small ? `<p class="warn">จำนวนช่องไม่ถึง ${N_SENT} ควรตีความอย่างระวัง</p>` : '');
      }
    }
    return cityCard(c, i, body);
  }).join(''));
  const hl = $('cmpHeadline');
  if (vals.length === 2) {
    const word = v => (v >= 0 ? 'ร้อนกว่า' : 'เย็นกว่า');
    const [[a, ra], [b, rb]] = vals;
    const nm = c => esc(cityShort(c.en)) + (cityShort(c.en).endsWith('ฯ') ? ' ' : '');
    hl.innerHTML = `ปี ${state.year} (${esc(seasonShort())}) เขตเมือง${nm(a)}${word(ra.suhii)}ชนบทรอบ ๆ <b>${num(Math.abs(ra.suhii))} °C</b> ส่วน${nm(b)}${word(rb.suhii)} <b>${num(Math.abs(rb.suhii))} °C</b>`;
    hl.hidden = false;
  } else hl.hidden = true;
}

function renderCmpTrend() {
  const box = $('cmpTrend');
  const cities = cmpCities();
  const slots = cities.map(c => slotOf('suhi', c));
  const okIdx = slots.map((s, i) => (s.st === 'ok' ? i : -1)).filter(i => i >= 0);
  killChart('cmp');
  if (!okIdx.length) {
    if (slots.some(s => s.st === 'load')) box.innerHTML = '<div class="loader"><div class="spin"></div><div>กำลังโหลดข้อมูล 20 ปี</div></div>';
    else if (slots.some(s => s.st === 'wait')) box.innerHTML = '<div class="state wait"><span>กราฟจะแสดงเมื่อข้อมูลพร้อม</span></div>';
    else setHTML(box, errSlot((slots.find(s => s.err) || {}).err, 'cmp'));
    return;
  }
  const years = yearAxis();
  const sw = years.findIndex(isViirsYear);
  const fits = {};
  const datasets = okIdx.map(i => {
    const c = cities[i], col = CITY_COLORS[i], d = slots[i].d;
    const by = Object.fromEntries((d.rows || []).filter(r => r && isNum(r.year)).map(r => [r.year, r]));
    const viirs = y => (by[y] ? by[y].source === 'VIIRS' : isViirsYear(y));
    fits[c.en] = ols(years.filter(y => !viirs(y) && by[y] && isNum(by[y].suhii)).map(y => [y, by[y].suhii]));
    return {
      label: cityShort(c.en), data: years.map(y => (by[y] && isNum(by[y].suhii) ? by[y].suhii : null)),
      borderColor: col, backgroundColor: col, borderWidth: 2.2, tension: 0,
      pointRadius: years.map(y => (y === state.year ? 6 : 3.2)), pointHoverRadius: 6, pointBorderWidth: 1.6, pointBorderColor: col,
      pointBackgroundColor: years.map(y => (viirs(y) ? '#fff' : col)),
      segment: { borderDash: s => (viirs(years[s.p1DataIndex]) ? [5, 4] : undefined) },
      _rows: by
    };
  });
  const missing = cities.filter((c, i) => !okIdx.includes(i)).map(c => cityShort(c.en));
  box.innerHTML = `<div class="chart-wrap tall"><canvas id="cmpChart" role="img" aria-label="กราฟเส้น ความต่างอุณหภูมิเมืองกับชนบทรายปีของสองเมือง"></canvas></div>
    <p class="note" style="margin-top:4px">จุดทึบ = MODIS Aqua · จุดโปร่งเส้นประ = VIIRS (ปรับเทียบให้ใกล้ Aqua) · จุดใหญ่ = ปีที่เลือก (${state.year})${missing.length ? ' · ยังไม่มีข้อมูลของ' + esc(missing.join(' และ ')) : ''}</p>
    <div class="slopes">${okIdx.map(i => {
      const c = cities[i], f = fits[c.en];
      if (!f) return `<div><i style="background:${CITY_COLORS[i]}"></i><span><b>${esc(cityShort(c.en))}</b> ข้อมูลปี Aqua ไม่พอคำนวณแนวโน้ม</span></div>`;
      const t = trendText(f);
      return `<div><i style="background:${CITY_COLORS[i]}"></i><span><b>${esc(cityShort(c.en))}</b> ${t.slope} °C ต่อ 10 ปี <span class="muted">(ช่วงความเชื่อมั่น 95%: ${t.lo} ถึง ${t.hi})</span> · ${t.verdict}</span></div>`;
    }).join('')}</div>
    <p class="note">แนวโน้มคิดจากปี ${cfg.first_year}–${cfg.aqua_last_year} (Aqua) ด้วยการถดถอยเชิงเส้น · ช่วงความเชื่อมั่น = ความชัน ± 1.96 × ค่าคลาดเคลื่อนมาตรฐาน</p>`;
  drawChart('cmp', 'cmpChart', {
    type: 'line',
    data: { labels: years, datasets },
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, font: { size: 12 } } },
        sensorSwitch: { index: sw > 0 ? sw : null },
        tooltip: { callbacks: {
          label: c => { if (c.parsed.y == null) return null; const r = c.dataset._rows[years[c.dataIndex]]; return `${c.dataset.label}: ${sgn(c.parsed.y)} °C` + (r && isNum(r.urban) && isNum(r.rural) ? ` (เมือง ${num(r.urban)} / ชนบท ${num(r.rural)})` : ''); },
          footer: items => (isViirsYear(years[items[0].dataIndex]) ? 'VIIRS (ปรับเทียบ)' : 'MODIS Aqua')
        } }
      },
      scales: {
        y: { beginAtZero: true, grace: '6%', title: { display: true, text: 'เมือง − ชนบท (°C)' }, grid: { color: c => (c.tick.value === 0 ? '#8d969b' : '#efe9e0') } },
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 8, font: { size: 11 } } }
      }
    }
  }, { title: 'ความต่างอุณหภูมิพื้นผิวเมือง − ชนบท (SUHII) ' + cities.map(c => cityShort(c.en)).join(' vs '), sub: `${seasonFull()} · ปี ${cfg.first_year}–${cfg.last_year} · จุดโปร่งเส้นประ = VIIRS (ปรับเทียบ)`, file: 'suhii' });
}

  cities.forEach((c, i) => killChart('cmpChange' + i));
  const ext = slots.flatMap(s => (s.st === 'ok' ? changeExtent(s.d) : []));

}

// =============================================================== ดาวน์โหลด
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const csvCell = v => { if (v == null) return ''; const s = String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function saveCsv(name, rows) {
  const text = rows.map(r => (r || []).map(csvCell).join(',')).join('\r\n');
  download(name, new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
}
function regionName() {
  if (!state.focus) return '';
  return state.focus.province ? provTitle(state.focus.province) : state.focus.title;
}
function fileBase() {
  const f = state.focus;
  const r = !f ? 'area' : f.province ? f.province.replace(/\s+/g, '_') : f.payload.geometry ? 'drawn_area' : 'point';
  return 'uhi_' + r;
}
const ciCols = r => { const c = ciOf(r); return c ? [r3(c.lo), r3(c.hi)] : ['', '']; };

function exportCsv(what) {
  const head = ['Urban Heat Explorer'];
  if (what === 'compare') return exportCompareCsv();
  if (what === 'overview' && last.summary) {
    const d = last.summary, { p1, p2, p3 } = prioOf(d), h = hotPeople(d);
    const rows = [head, ['พื้นที่', regionName()], ['ปี', d.year], ['ฤดู', seasonFull(d.season)], ['ดาวเทียม', d.source], ['พื้นที่ (ตร.กม.)', r3(d.area_km2)], [],
      ['อุณหภูมิพื้นผิวช่วงบ่ายเฉลี่ยในย่านที่มีคนอยู่ (°C)', r3(d.lst_lived)], ['ประชากร (GHSL ' + (d.pop_epoch || '') + ')', Math.round(d.pop_total || 0)],
      [`คนในย่านผิวเกิน ${cfg.very_hot} °C`, Math.round(h.hot), h.pct + '% ของผู้อยู่อาศัยทั้งหมด'],
      ['คนในช่องที่ไม่มีข้อมูลอุณหภูมิ', Math.round(h.noData), h.noDataPct + '%'], [],
      ['กลุ่ม', 'พื้นที่ (ตร.กม.)', 'คน', 'ที่ว่างปลูกต้นไม้ (ตร.กม.)'],
      ['เร่งด่วน มีพื้นที่ปลูกต้นไม้เพิ่มได้', r3(p3.area_km2), Math.round(p3.people), r3(p3.plant_km2)],
      ['เร่งด่วน ไม่มีที่ว่างปลูก', r3(p2.area_km2), Math.round(p2.people), r3(p2.plant_km2)],
      ['เฝ้าระวัง', r3(p1.area_km2), Math.round(p1.people), ''], [],
      ['ระดับอุณหภูมิพื้นผิว', 'คน'], ...h.ex.map(r => [LEVEL_NAMES[r.level], Math.round(r.people || 0)]), [],
      ['พื้นผิว', 'สัดส่วนในย่านที่มีคนอยู่', 'สัดส่วนทั้งพื้นที่'], ...COVER.map(([k, n]) => [n, r3((d.cover_lived || {})[k]), r3((d.cover_all || {})[k])])];
    if (Array.isArray(d.sensitivity) && d.sensitivity.length) {
      rows.push([], ['ความไวต่อเกณฑ์: ผิวร้อนเกิน (°C)', 'สีเขียวน้อยกว่า', 'ย่านเร่งด่วน (ตร.กม.)', 'คน']);
      d.sensitivity.forEach(r => rows.push([r.t, Math.round(r.g * 100) + '%', r3(r.area_km2), Math.round(r.people || 0)]));
    }
    return saveCsv(`${fileBase()}_overview_${d.year}_${d.season}.csv`, rows);
  }
  if (what === 'year' && last.bins) {
    const d = last.bins, rows = [head, ['พื้นที่', regionName()], ['ปี', d.year], ['ฤดู', seasonFull(d.season)], ['ดาวเทียม', d.source], [],
      ['แยกตาม', 'กลุ่ม', 'อุณหภูมิเฉลี่ย (°C)', 'SD', 'ช่อง (n)', 'ช่วง 95% ต่ำ', 'ช่วง 95% สูง']];
    [['green', 'พื้นที่สีเขียว'], ['built', 'สิ่งปลูกสร้าง']].forEach(([k, n]) => (d[k] || []).forEach(r => rows.push([n, r.label, r3(r.mean), r3(r.sd), r.count, ...ciCols(r)])));
    return saveCsv(`${fileBase()}_bins_${d.year}_${d.season}.csv`, rows);
  }
  if (what === 'trend' && last.trend) {
    const d = last.trend, rows = [head, ['พื้นที่', regionName()], ['ฤดู', seasonFull(d.season)], [], ['ปี', 'ดาวเทียม', 'อุณหภูมิเฉลี่ย (°C)', 'SD', 'ช่อง (n)']];
    (d.rows || []).forEach(r => rows.push([r.year, r.source, r3(r.lst), r3(r.sd), r.count]));
    rows.push([], ['ปี GHSL', 'สัดส่วนอาคาร (%)']);
    (d.built || []).forEach(b => rows.push([b.epoch, r3(b.built)]));
    return saveCsv(`${fileBase()}_trend_${d.season}.csv`, rows);
  }
  if (what === 'change' && last.change) {
    const d = last.change, rows = [head, ['พื้นที่', regionName()], ['ฤดู', seasonFull(d.season)], ['ช่วง', '2003–07 → 2018–22'], [],
      ['กลุ่ม', 'อุณหภูมิที่เปลี่ยนไป (°C)', 'SD', 'ช่อง (n)', 'ช่วง 95% ต่ำ', 'ช่วง 95% สูง']];
    (d.rows || []).forEach(r => rows.push([r.label, r3(r.mean), r3(r.sd), r.count, ...ciCols(r)]));
    return saveCsv(`${fileBase()}_change_${d.season}.csv`, rows);
  }
  setStatus('ยังไม่มีข้อมูลให้ดาวน์โหลด รอให้โหลดเสร็จก่อน', 'warn');
}

function exportCompareCsv() {
  const cities = cmpCities();
  const rows = [['Urban Heat Explorer', cmpTitle()], ['ฤดู', seasonFull()], ['ปีที่เลือก', state.year], [],
    ['ความต่างอุณหภูมิเมือง − ชนบท (SUHII)'], ['เมือง', 'ปี', 'ดาวเทียม', 'นิยามเขตเมือง', 'อุณหภูมิเมือง (°C)', 'อุณหภูมิชนบท (°C)', 'SUHII (°C)', 'ช่องเมือง (n)', 'ช่องชนบท (n)']];
  cities.forEach(c => {
    const s = slotOf('suhi', c);
    if (s.st === 'ok') (s.d.rows || []).forEach(r => rows.push([cityShort(c.en), r.year, r.source, s.d.urban_def, r3(r.urban), r3(r.rural), r3(r.suhii), r.n_urban, r.n_rural]));
    else rows.push([cityShort(c.en), 'ยังไม่มีข้อมูล']);
  });
  rows.push([], [`แนวโน้ม SUHII ปี ${cfg.first_year}–${cfg.aqua_last_year} (Aqua)`], ['เมือง', '°C ต่อ 10 ปี', 'ช่วง 95% ต่ำ', 'ช่วง 95% สูง', 'จำนวนปี']);
  cities.forEach(c => {
    const s = slotOf('suhi', c);
    if (s.st !== 'ok') return;
    const f = ols((s.d.rows || []).filter(r => r && r.source !== 'VIIRS' && r.year <= cfg.aqua_last_year && isNum(r.suhii)).map(r => [r.year, r.suhii]));
    if (f) rows.push([cityShort(c.en), r3(f.b * 10), r3((f.b - 1.96 * f.se) * 10), r3((f.b + 1.96 * f.se) * 10), f.n]);
  });
  rows.push([], ['อุณหภูมิที่เปลี่ยนไป 2003–07 → 2018–22 แยกตามระดับที่อาคารเพิ่ม'], ['เมือง', 'กลุ่ม', 'อุณหภูมิที่เปลี่ยนไป (°C)', 'SD', 'ช่อง (n)', 'ช่วง 95% ต่ำ', 'ช่วง 95% สูง']);
  cities.forEach(c => {
    const s = slotOf('change', c);
    if (s.st === 'ok') (s.d.rows || []).forEach(r => rows.push([cityShort(c.en), r.label, r3(r.mean), r3(r.sd), r.count, ...ciCols(r)]));
  });
  rows.push([], [`สรุปปี ${state.year} (${seasonShort()})`], ['เมือง', 'ประชากร (GHSL)', `คนในย่านผิวเกิน ${cfg.very_hot} °C`, '% ของผู้อยู่อาศัยทั้งหมด', 'คนในช่องที่ไม่มีข้อมูลอุณหภูมิ', 'ย่านเร่งด่วน (ตร.กม.)', 'คนในย่านเร่งด่วน', 'เร่งด่วนที่มีพื้นที่ปลูกต้นไม้เพิ่มได้ (ตร.กม.)', 'ที่ว่างปลูกต้นไม้ (ตร.กม.)']);
  cities.forEach(c => {
    const s = slotOf('summary', c);
    if (s.st !== 'ok') return;
    const h = hotPeople(s.d), pr = prioOf(s.d);
    rows.push([cityShort(c.en), Math.round(h.total), Math.round(h.hot), h.pct, Math.round(h.noData), r3(pr.uA), Math.round(pr.uP), r3(pr.p3.area_km2), r3(pr.p3.plant_km2)]);
  });

// บันทึกกราฟเป็น PNG พร้อมหัวเรื่องและที่มา (พื้นหลังขาว ใช้ในรายงานได้)
function exportPng(key) {
  const ch = charts[key];
  if (!ch) { setStatus('ยังไม่มีกราฟให้บันทึก', 'warn'); return; }
  const meta = chartMeta[key] || {};
  // วาดกราฟใหม่ที่ความละเอียด 2 เท่าชั่วคราว ให้รูปคมพอใช้ในรายงาน
  const prevRatio = ch.options.devicePixelRatio;
  const hiRes = (window.devicePixelRatio || 1) < 2;
  if (hiRes) { ch.options.devicePixelRatio = 2; ch.resize(); ch.draw(); }
  const src = ch.canvas, r = src.width / Math.max(1, ch.width);
  const pad = 18 * r, head = (meta.sub ? 56 : 38) * r, foot = 28 * r;
  const out = document.createElement('canvas');
  out.width = src.width + pad * 2;
  out.height = src.height + head + foot;
  const x = out.getContext('2d');
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, out.width, out.height);
  x.textBaseline = 'top';
  const fit = (text, size, weight, family) => {
    let s = size;
    do { x.font = `${weight} ${s * r}px ${family}`; s -= 0.5; } while (x.measureText(text).width > out.width - pad * 2 && s > 9);
  };
  x.fillStyle = '#1d2327';
  fit(meta.title || '', 16, 600, "Anuphan, 'IBM Plex Sans Thai', sans-serif");
  x.fillText(meta.title || '', pad, 12 * r);
  if (meta.sub) {
    x.fillStyle = '#6b7378';
    fit(meta.sub, 12.5, 400, "'IBM Plex Sans Thai', sans-serif");
    x.fillText(meta.sub, pad, 34 * r);
  }
  x.drawImage(src, pad, head);
  x.fillStyle = '#6b7378';
  const credit = 'Urban Heat Explorer · ข้อมูล: NASA MODIS/VIIRS, GHSL (JRC), Dynamic World, ESA WorldCover';
  fit(credit, 11, 400, "'IBM Plex Sans Thai', sans-serif");
  x.fillText(credit, pad, head + src.height + 8 * r);
  if (hiRes) { ch.options.devicePixelRatio = prevRatio; ch.resize(); }
  out.toBlob(b => { if (b) download(`${key.startsWith('cmp') ? 'uhi_compare' : fileBase()}_${meta.file || key}.png`, b); }, 'image/png');
}

// พื้นที่ (ตร.กม.) โดยประมาณของรูปที่วาด
function ringAreaKm2(latlngs) {
  const R = 6371.0088, rad = Math.PI / 180;
  let s = 0;
  for (let i = 0; i < latlngs.length; i++) {
    const p1 = latlngs[i], p2 = latlngs[(i + 1) % latlngs.length];
    s += (p2.lng - p1.lng) * rad * (2 + Math.sin(p1.lat * rad) + Math.sin(p2.lat * rad));
  }
  return Math.abs(s * R * R / 2);
}
map.on(L.Draw.Event.CREATED, e => {
  activeDraw = null;
  const layer = e.layer;
  const ring = layer.getLatLngs()[0] || [];
  const area = ringAreaKm2(ring);
  if (cfg.max_area_km2 && area > cfg.max_area_km2) {
    setStatus(`พื้นที่ที่วาดใหญ่เกินไป (ราว ${nf(area)} ตร.กม.) วาดได้ไม่เกิน ${nf(cfg.max_area_km2)} ตร.กม. หรือเลือกเป็นจังหวัดแทน`, 'warn');
    return;
  }
  $('province').value = '';
  layer.options.interactive = false;
  layer.addTo(map);
  setFocusLayer(layer);
  newFocus({ geometry: layer.toGeoJSON().geometry }, 'พื้นที่ที่วาด');
});

function fitFocus(layer) {
  map.invalidateSize();
  const size = map.getSize();
  if (!size.x || !size.y) {
    document.addEventListener('visibilitychange', () => { if (focusLayer === layer) fitFocus(layer); }, { once: true });
    return;
  }
  const mobile = window.innerWidth <= 860, open = state.panel;
  const bar = $('bar').offsetHeight + 24;
  const right = open && !mobile ? $('panel').offsetWidth + 30 : 20;
  const bottom = mobile && open ? bar + $('panel').offsetHeight + 10 : bar;
  map.fitBounds(layer.getBounds(), { paddingTopLeft: [mobile ? 50 : 60, mobile ? 56 : 20], paddingBottomRight: [right, bottom], maxZoom: 13 });
}

async function selectProvince(en) {
  cancelDraw();
  setFocusLayer(null);
  $('province').value = provTh(en);

  try {

    if (!ctx.live()) return;
    const layer = L.geoJSON(g, { interactive: false, style: FOCUS_STYLE }).addTo(map);
    setFocusLayer(layer);

    if (!isAbort(err) && ctx.live()) setStatus('โหลดขอบเขตจังหวัดไม่ได้: ' + errMsg(err), 'warn');
